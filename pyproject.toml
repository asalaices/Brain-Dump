[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-bridge-framework"
version = "0.4.1"
description = "Git-backed immutable memory and authenticated managed-source foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Creative Software Development"}]

[project.scripts]
brain-bridge = "brain_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["brain_bridge*"]

[tool.setuptools.data-files]
"share/brain-bridge/skills/brain-bridge" = ["skills/brain-bridge/SKILL.md"]
"share/brain-bridge/skills/brain-bridge/references" = ["skills/brain-bridge/references/agent-adapters.md"]
