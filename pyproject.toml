[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-bridge-framework"
version = "0.8.6"
description = "Git-backed immutable memory and authenticated managed-source foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Creative Software Development"}]

[project.scripts]
brain-bridge = "brain_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["brain_bridge*"]

[tool.setuptools.data-files]
"share/brain-bridge/skills/brain-dump" = ["skills/brain-dump/SKILL.md", "skills/brain-dump/README.md", "skills/brain-dump/install.sh"]
"share/brain-bridge/skills/brain-dump/references" = ["skills/brain-dump/references/agent-adapters.md", "skills/brain-dump/references/submission.md"]
"share/brain-bridge/schemas" = ["schemas/record.v3.synthetic.json"]
"share/brain-bridge/docs" = ["docs/*.md"]
