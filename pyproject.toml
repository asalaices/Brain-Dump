[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-bridge-framework"
version = "0.2.0"
description = "Git-backed immutable memory and authenticated managed-source foundation"
requires-python = ">=3.11"
# License remains pending the owner's selection and rights audit.

[project.scripts]
brain-bridge = "brain_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["brain_bridge*"]
