<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
<title id="title">Brain delivery architecture — direct Git, synced cache and shared access</title>
<desc id="desc">Planned BDT architecture. Public Brain-Dump software reads authorized private Git sources directly or through a continuous sync worker and verified derived cache. A shared query service serves local CLI, local MCP, remote authenticated MCP and web clients. Optional interpretation is separate. Bootstrap configures binaries, storage, services, optional tunnels and client settings. Strict authorization remains the default; this is a roadmap, not deployed capability.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1427"/><stop offset="1" stop-color="#111e35"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#60d5c1"/></marker>
  <marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a1a9c5"/></marker>
  <style>
    text {font-family:Arial,Helvetica,sans-serif;fill:#edf3ff}
    .title {font-size:35px;font-weight:700;letter-spacing:-.5px}
    .sub {font-size:18px;fill:#aebdd6}
    .label {font-size:13px;font-weight:700;letter-spacing:1.4px;fill:#79e3cf}
    .head {font-size:21px;font-weight:700}
    .body {font-size:16px;fill:#bac9df}
    .small {font-size:14px;fill:#aebdd6}
    .edge {fill:none;stroke:#60d5c1;stroke-width:2.5;marker-end:url(#arrow)}
    .optional {fill:none;stroke:#a1a9c5;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#muted)}
  </style>
</defs>
<rect width="1600" height="1600" fill="url(#bg)"/>

<text x="50" y="58" class="title">One Brain runtime. Several ways to connect.</text>
<text x="50" y="88" class="sub">BDT architecture • planned delivery • 06 Nov 2026 • cache lives beside the service, on a personal computer or server</text>
<rect x="50" y="112" width="740" height="78" rx="15" fill="#15243b" stroke="#344862"/>
<text x="70" y="139" class="label">PUBLIC SOFTWARE  /  BRAIN-DUMP</text>
<text x="70" y="167" class="body">Engine · CLI · sync service · bootstrap · MCP adapters · web UI</text>
<rect x="810" y="112" width="740" height="78" rx="15" fill="#20263b" stroke="#62577f"/>
<text x="830" y="139" class="label" style="fill:#d5b9ff">PRIVATE DATA  /  AUTHORIZED SYNAPSES REPOSITORIES</text>
<text x="830" y="167" class="body">Immutable records · provenance · reviewed source access policy</text>
<text x="50" y="235" class="label">A  DIRECT GIT ACCESS</text>
<rect x="50" y="260" width="290" height="118" rx="15" fill="#17263e" stroke="#344862"/>
<text x="70" y="287" class="label" style="fill:#79e3cf">NAMED SOURCE</text>
<text x="70" y="317" class="head">Private Git remote</text>
<text x="70" y="345" class="body">Authenticated identity + policy</text>
<rect x="430" y="260" width="700" height="118" rx="15" fill="#17263e" stroke="#344862"/>
<text x="450" y="287" class="label" style="fill:#79e3cf">ONE-SHOT MODE</text>
<text x="450" y="317" class="head">Direct Git consultation</text>
<text x="450" y="345" class="body">Obtain verified Git snapshot → search → cited result; no persistent index required</text>
<rect x="1200" y="260" width="350" height="118" rx="15" fill="#17263e" stroke="#344862"/>
<text x="1220" y="287" class="label" style="fill:#79e3cf">LOCAL COMMAND CLIENT</text>
<text x="1220" y="317" class="head">CLI / Intelli Bot</text>
<text x="1220" y="345" class="body">Command-capable agent</text>
<path d="M340 319 H430" class="edge"/>
<path d="M1130 319 H1200" class="edge"/>
<rect x="400" y="414" width="750" height="797" rx="22" fill="#101e33" stroke="#437c80"/>
<text x="425" y="445" class="label">B–E  SHARED SERVICE INSTANCE</text>
<text x="425" y="468" class="small">Runs on a laptop, workstation, NAS or always-on server</text>
<rect x="50" y="505" width="290" height="154" rx="15" fill="#17263e" stroke="#344862"/>
<text x="70" y="532" class="label" style="fill:#79e3cf">NAMED SOURCE</text>
<text x="70" y="562" class="head">Private Git remote</text>
<text x="70" y="590" class="body">Merged immutable records</text>
<text x="70" y="613" class="body">Read and write grants differ</text>
<rect x="435" y="500" width="300" height="140" rx="15" fill="#17263e" stroke="#344862"/>
<text x="455" y="527" class="label" style="fill:#79e3cf">BACKGROUND WORKER</text>
<text x="455" y="557" class="head">Continuous sync</text>
<text x="455" y="585" class="body">Poll + optional webhook hints</text>
<text x="455" y="608" class="body">Authenticate · fetch · validate</text>
<rect x="790" y="500" width="320" height="140" rx="15" fill="#17263e" stroke="#344862"/>
<text x="810" y="527" class="label" style="fill:#79e3cf">PROTECTED INSTANCE STORAGE</text>
<text x="810" y="557" class="head">Verified cache + index</text>
<text x="810" y="585" class="body">Owned Git reader + SQLite</text>
<text x="810" y="608" class="body">Atomic generations · rebuildable</text>
<path d="M340 574 H435" class="edge"/>
<path d="M735 574 H790" class="edge"/>
<text x="50" y="697" class="small">Remote Git remains authoritative.</text>
<text x="50" y="721" class="small">Sync never publishes or merges.</text>
<text x="50" y="766" class="label" style="fill:#d5b9ff">SEPARATE WRITE FLOW</text>
<rect x="50" y="784" width="290" height="150" rx="15" fill="#20263b" stroke="#62577f"/>
<text x="70" y="816" class="head">Optional publisher</text>
<text x="70" y="849" class="body">Stable draft → validated PR</text>
<text x="70" y="874" class="body">→ canonical receipt after merge</text>
<text x="70" y="905" class="small">Preserve original bytes on retries.</text>
<path d="M50 850 H25 V620 H50" class="edge"/>
<rect x="435" y="710" width="380" height="200" rx="15" fill="#173a40" stroke="#60d5c1"/>
<text x="455" y="740" class="label">ONE AUTHORIZED QUERY ENGINE</text>
<text x="455" y="775" class="head">Shared query + status service</text>
<text x="455" y="811" class="body">Caller → permitted source → verified result</text>
<text x="455" y="835" class="body">Strict upstream authorization by default</text>
<text x="455" y="859" class="body">Commit · entry ID · hash · JSON Pointer</text>
<text x="455" y="883" class="body">Data freshness ≠ authorization freshness</text>
<path d="M820 640 V675 H625 V710" class="edge"/>
<path d="M815 810 H850 V707 H890" class="edge"/>
<path d="M850 810 V847 H890" class="edge"/>
<path d="M850 847 V987 H890" class="edge"/>
<path d="M850 987 V1127 H890" class="edge"/>
<rect x="890" y="650" width="220" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="905" y="675" class="label">B  LOCAL BOT</text>
<text x="905" y="706" class="head">CLI / local API</text>
<text x="905" y="734" class="small" style="font-size:12px">Same engine; thin adapter</text>
<path d="M1110 707 H1200" class="edge"/>
<rect x="890" y="790" width="220" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="905" y="815" class="label">C  LOCAL MCP</text>
<text x="905" y="846" class="head">stdio adapter</text>
<text x="905" y="874" class="small" style="font-size:12px">No public tunnel needed</text>
<path d="M1110 847 H1200" class="edge"/>
<rect x="890" y="930" width="220" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="905" y="955" class="label">D  REMOTE MCP</text>
<text x="905" y="986" class="head">HTTPS MCP</text>
<text x="905" y="1014" class="small" style="font-size:12px">Authenticated caller + source</text>
<path d="M1110 987 H1200" class="edge"/>
<rect x="890" y="1070" width="220" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="905" y="1095" class="label">E  WEB EXPERIENCE</text>
<text x="905" y="1126" class="head">Web API</text>
<text x="905" y="1154" class="small" style="font-size:12px">Authorized records + aggregates</text>
<path d="M1110 1127 H1200" class="edge"/>
<rect x="1200" y="650" width="350" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="1220" y="677" class="label" style="fill:#79e3cf">LOCAL EXECUTION</text>
<text x="1220" y="707" class="head">Bot / coding agent</text>
<text x="1220" y="735" class="body">Queries the cache beside the service</text>
<rect x="1200" y="790" width="350" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="1220" y="817" class="label" style="fill:#79e3cf">COMPATIBLE LOCAL CLIENT</text>
<text x="1220" y="847" class="head">Desktop / editor MCP</text>
<text x="1220" y="875" class="body">Client launches stdio adapter</text>
<rect x="1200" y="930" width="350" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="1220" y="957" class="label" style="fill:#79e3cf">COMPATIBLE REMOTE CLIENT</text>
<text x="1220" y="987" class="head">Web / desktop assistant</text>
<text x="1220" y="1015" class="body">Reachable HTTPS; optional tunnel</text>
<rect x="1200" y="1070" width="350" height="114" rx="15" fill="#17263e" stroke="#344862"/>
<text x="1220" y="1097" class="label" style="fill:#79e3cf">HUMAN BROWSER</text>
<text x="1220" y="1127" class="head">Brain UI + word globe</text>
<text x="1220" y="1155" class="body">Search · citations · sync status</text>
<text x="1200" y="489" class="label" style="fill:#d5b9ff">CLIENT CAPABILITY MATTERS</text>
<text x="1200" y="522" class="body">ChatGPT web, Copilot integrations</text>
<text x="1200" y="546" class="body">and desktop apps differ by version.</text>
<text x="1200" y="575" class="small">Test supported connections explicitly.</text>
<rect x="435" y="1005" width="380" height="140" rx="15" fill="#17263e" stroke="#344862"/>
<text x="455" y="1032" class="label" style="fill:#79e3cf">OPTIONAL BACKEND</text>
<text x="455" y="1062" class="head">Interpretation / Ollama</text>
<text x="455" y="1090" class="body">Queued analysis of selected extracts</text>
<text x="455" y="1113" class="body">Citations + labeled inference; no auto grants</text>
<path d="M625 910 V1005" class="optional"/>
<rect x="50" y="1250" width="1500" height="142" rx="20" fill="#222541" stroke="#68628e"/>
<text x="75" y="1283" class="label" style="fill:#d5b9ff">BOOTSTRAP OWNS INSTALLATION AND CONFIGURATION  /  BDT22–29</text>
<text x="75" y="1317" class="body">Verified binaries → protected storage + credential references → owned services → optional tunnel / DNS / TLS → MCP settings</text>
<text x="75" y="1348" class="body">Mode-aware plan first · dependency ordering · preserve client settings · health checks · idempotent upgrade · rollback · owned-resource uninstall</text>
<text x="75" y="1375" class="small">Local-only mode needs no tunnel. Server mode can use direct HTTPS. Existing credentials and unrelated resources are preserved.</text>
<path d="M60 1430 H112" class="edge"/>
<text x="130" y="1435" class="small">Verified data / query-result path</text>
<path d="M470 1430 H522" class="optional"/>
<text x="540" y="1435" class="small">Optional interpretation</text>
<text x="860" y="1435" class="small" style="fill:#79e3cf">Derived cache ≠ authority to disclose private records</text>
<text x="50" y="1473" class="small">Authorization leases are a separate policy decision. Strict checks remain the default; no cached-allow fallback on authorization failure.</text>
<text x="50" y="1499" class="small">Architecture roadmap, not a deployment claim. See docs/roadmap/README.md for delivery gates, acceptance and compatibility requirements.</text>
</svg>
