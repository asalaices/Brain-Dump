name: Offline framework acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Cortex browser foundation behavioral tests
        run: node --test tests/web/*.test.mjs
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Package installation
        run: python -m pip install --disable-pip-version-check .
      - name: Offline tests with zero skips
        shell: python
        run: |
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
      - name: Installed command and license notice
        run: brain-bridge --license
      - name: Installed shared skill artifact
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as directory:
              result = subprocess.run([sys.executable, '-m', 'brain_bridge', 'skill', '--json'], cwd=directory, capture_output=True, text=True, check=True)
              receipt = json.loads(result.stdout)
              skill = pathlib.Path(receipt['path'])
              assert skill.is_file()
              assert (skill.parent / 'references' / 'agent-adapters.md').is_file()
              assert receipt['activates_sources'] is False
              assert receipt['skill_name'] == 'brain-dump'
              assert '\nname: brain-dump\n' in receipt['content']
      - name: Installed operator package and CLI boundary
        shell: python
        run: |
          import subprocess, sys, tempfile
          probe = "import inspect, pathlib, sys; import brain_bridge.operator as op; assert pathlib.Path(op.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); assert 'expected_generation' in inspect.signature(op.dispatch).parameters"
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([sys.executable, '-I', '-c', probe], cwd=directory, check=True)
              result = subprocess.run([sys.executable, '-I', '-m', 'brain_bridge', 'operator', '--help'], cwd=directory, capture_output=True, text=True, check=True)
              assert '--expected-policy-commit' in result.stdout
      - name: Standalone installation without private integration code
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile
          if os.name != 'nt':
              with tempfile.TemporaryDirectory() as directory:
                  subprocess.run([sys.executable, '-m', 'pip', 'wheel', '--disable-pip-version-check', '--no-deps', '--wheel-dir', directory, '.'], check=True)
                  wheels = list(pathlib.Path(directory).glob('brain_bridge_framework-*.whl'))
                  assert len(wheels) == 1
                  subprocess.run([sys.executable, 'tests/acceptance_standalone.py', '--wheel', str(wheels[0].resolve())], check=True)
